name: SURE content review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    name: Validate and test SURE website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce content-only changes from staff staging
        if: github.head_ref == 'content-staging'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:scripts/check-editor-changes.mjs" > "$RUNNER_TEMP/check-editor-changes.mjs"
          node "$RUNNER_TEMP/check-editor-changes.mjs" "$BASE_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run test:content
      - run: bun run lint
      - run: bun run build:pages
        env:
          GITHUB_PAGES: 'true'
      - run: bunx playwright install --with-deps chromium
      - run: mkdir -p "$RUNNER_TEMP/sure-review" && bun run test:browser
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/sure-review
      - uses: actions/upload-artifact@v4
        with:
          name: sure-review-screenshots
          path: ${{ runner.temp }}/sure-review/
          retention-days: 5
